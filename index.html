<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Родные напевы — репертуар</title>

<style>
  :root {
    --bg: #f6f3ee; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --accent: #9a3412; --accent-soft: #fed7aa; --line: #e7e5e4;
    --tag: #f5f5f4; --ok: #166534; --ok-bg: #dcfce7; --no: #a8a29e;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #9a3412 0%, #c2410c 55%, #ea580c 100%);
    color: #fff; padding: 1.15rem 1rem 1.35rem; position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 12px rgba(154,52,18,.25);
  }
  header .wrap { max-width: 920px; margin: 0 auto; }
  header .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  header p { opacity: .85; font-size: .85rem; margin-top: .15rem; }
  .auth-btn {
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.45);
    color: #fff; padding: .4rem .75rem; border-radius: 8px; font-size: .8rem;
    cursor: pointer; white-space: nowrap;
  }
  .auth-btn:hover { background: rgba(255,255,255,.3); }
  .auth-btn.out { background: rgba(0,0,0,.15); }
  .search-box { margin-top: .85rem; position: relative; }
  .search-box input {
    width: 100%; padding: .72rem 1rem .72rem 2.55rem; border: none; border-radius: 12px;
    font-size: 1rem; background: rgba(255,255,255,.96); color: var(--ink); outline: none;
    box-shadow: var(--shadow);
  }
  .search-box input::placeholder { color: #a8a29e; }
  .search-box .icon { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); opacity: .45; pointer-events: none; }
  main { max-width: 920px; margin: 0 auto; padding: 1rem 1rem 5rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .75rem; }
  .count { font-size: .9rem; color: var(--muted); margin-right: auto; }
  .count strong { color: var(--ink); }
  .sort-select, .extra-select {
    padding: .38rem .65rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-size: .82rem; color: var(--ink);
  }
  .admin-bar {
    display: none; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
    padding: .65rem .85rem; margin-bottom: .85rem; font-size: .88rem;
    align-items: center; gap: .6rem; flex-wrap: wrap;
  }
  .admin-bar.show { display: flex; }
  .admin-bar button {
    background: var(--accent); color: #fff; border: none; padding: .4rem .75rem;
    border-radius: 8px; font-size: .82rem; cursor: pointer;
  }
  .admin-bar button.secondary { background: #fff; color: var(--accent); border: 1px solid #fdba74; }
  .admin-bar .hint { color: #9a3412; flex: 1; min-width: 140px; }
  .filters { display: flex; flex-wrap: wrap; gap: .38rem; margin-bottom: .9rem; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: .32rem .65rem; border-radius: 999px; font-size: .78rem; cursor: pointer;
    transition: .15s; user-select: none; white-space: nowrap;
  }
  .chip:hover { border-color: #d6d3d1; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .55; font-size: .75em; margin-left: .12rem; }
  .chip.active .n { opacity: .85; }
  .more-filters-btn {
    border: 1px dashed var(--line); background: transparent; color: var(--muted);
    padding: .32rem .65rem; border-radius: 999px; font-size: .78rem; cursor: pointer;
  }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 1rem 1.1rem;
    margin-bottom: .6rem; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,.03);
    cursor: pointer; transition: .15s;
  }
  .card:hover { border-color: #fdba74; }
  .card.open { border-color: #fb923c; }
  .card-top { display: flex; justify-content: space-between; gap: .7rem; align-items: flex-start; }
  .title { font-weight: 650; font-size: 1.02rem; letter-spacing: -0.01em; }
  .key-badge {
    flex-shrink: 0; background: var(--accent-soft); color: var(--accent);
    font-weight: 700; font-size: .78rem; padding: .18rem .5rem; border-radius: 6px;
  }
  .meta { color: var(--muted); font-size: .86rem; margin-top: .22rem; }
  .meta .sep { margin: 0 .28rem; opacity: .4; }
  .quick-row { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; align-items: center; }
  .pill { font-size: .72rem; padding: .12rem .45rem; border-radius: 6px; background: #f5f5f4; color: #57534e; }
  .pill.freq-often { background: #dcfce7; color: #166534; }
  .pill.freq-sometimes { background: #fef9c3; color: #854d0e; }
  .pill.freq-rare { background: #ffedd5; color: #9a3412; }
  .pill.freq-archive { background: #e7e5e4; color: #57534e; }
  .tags-row { display: flex; flex-wrap: wrap; gap: .28rem; margin-top: .5rem; }
  .tag { background: var(--tag); color: #57534e; font-size: .7rem; padding: .12rem .45rem; border-radius: 6px; }
  .details { display: none; margin-top: .7rem; padding-top: .7rem; border-top: 1px solid var(--line); font-size: .9rem; }
  .card.open .details { display: block; }
  .details dl { display: grid; grid-template-columns: 140px 1fr; gap: .38rem .75rem; }
  .details dt { color: var(--muted); }
  .details dd { word-break: break-word; }
  .details dd.dash { color: #a8a29e; }
  .materials { display: flex; flex-wrap: wrap; gap: .4rem; }
  .mat {
    font-size: .75rem; padding: .25rem .55rem; border-radius: 8px;
    border: 1px solid var(--line); color: var(--no); background: #fafaf9;
  }
  .mat.yes { background: var(--ok-bg); border-color: #bbf7d0; color: var(--ok); font-weight: 600; }
  .note-box {
    margin-top: .7rem; background: #fff7ed; border-left: 3px solid #fb923c;
    padding: .5rem .7rem; border-radius: 0 8px 8px 0; font-size: .85rem; color: #9a3412;
  }
  .edit-actions { margin-top: .75rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  .edit-actions button {
    background: var(--accent); color: #fff; border: none; padding: .45rem .85rem;
    border-radius: 8px; font-size: .85rem; cursor: pointer;
  }
  .edit-actions button.secondary { background: #fff; color: var(--accent); border: 1px solid #fdba74; }
  .edit-actions button.danger { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty .big { font-size: 2.5rem; margin-bottom: .5rem; }
  footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: .8rem; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 100; align-items: flex-end; justify-content: center; padding: 0;
  }
  .modal-overlay.show { display: flex; }
  @media (min-width: 560px) {
    .modal-overlay { align-items: center; padding: 1rem; }
  }
  .modal {
    background: #fff; width: 100%; max-width: 520px; max-height: 92vh;
    overflow-y: auto; border-radius: 16px 16px 0 0; padding: 1.25rem;
  }
  @media (min-width: 560px) { .modal { border-radius: 16px; } }
  .modal h2 { font-size: 1.15rem; margin-bottom: 1rem; }
  .modal label { display: block; font-size: .78rem; color: var(--muted); margin: .55rem 0 .2rem; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: .55rem .7rem; border: 1px solid var(--line);
    border-radius: 8px; font-size: .95rem; font-family: inherit;
  }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .modal .checks { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .35rem; }
  .modal .checks label {
    display: flex; align-items: center; gap: .35rem; margin: 0;
    font-size: .85rem; color: var(--ink); background: #f5f5f4;
    padding: .35rem .6rem; border-radius: 8px; cursor: pointer;
  }
  .modal .checks input { width: auto; }
  .modal-actions {
    display: flex; gap: .5rem; margin-top: 1.1rem; flex-wrap: wrap;
  }
  .modal-actions button {
    flex: 1; min-width: 100px; padding: .6rem; border-radius: 10px;
    border: none; font-size: .95rem; cursor: pointer;
  }
  .modal-actions .save { background: var(--accent); color: #fff; }
  .modal-actions .cancel { background: #f5f5f4; color: var(--ink); }
  .login-error { color: #b91c1c; font-size: .85rem; margin-top: .5rem; display: none; }
  .toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: #1c1917; color: #fff; padding: .65rem 1.1rem; border-radius: 999px;
    font-size: .88rem; z-index: 200; display: none; box-shadow: var(--shadow);
  }
  .toast.show { display: block; }
  .loading { text-align: center; padding: 2rem; color: var(--muted); }
  @media (min-width: 640px) { header h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>Родные напевы</h1>
        <p>Библиотека репертуара</p>
      </div>
      <button type="button" class="auth-btn" id="authBtn">Войти</button>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="search" id="q" placeholder="Поиск: название, композитор, исполнитель…" autocomplete="off">
    </div>
  </div>
</header>

<main>
  <div class="admin-bar" id="adminBar">
    <span class="hint">Режим редактирования</span>
    <button type="button" id="addBtn">+ Добавить песню</button>
    <button type="button" class="secondary" id="seedBtn" style="display:none">Загрузить 95 песен в базу</button>
  </div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <select class="sort-select" id="sort">
      <option value="title">По названию</option>
      <option value="composer">По композитору</option>
      <option value="key">По тональности</option>
      <option value="frequency">По частоте</option>
    </select>
    <select class="extra-select" id="freqFilter">
      <option value="">Частота: все</option>
      <option value="Часто">Часто</option>
      <option value="Иногда">Иногда</option>
      <option value="Редко">Редко</option>
      <option value="Архив">Архив</option>
    </select>
    <select class="extra-select" id="perfFilter">
      <option value="">Тип: все</option>
      <option value="Соло">Соло</option>
      <option value="Дуэт">Дуэт</option>
      <option value="Трио">Трио</option>
      <option value="Ансамбль">Ансамбль</option>
      <option value="Инструментал">Инструментал</option>
    </select>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"><div class="loading">Загрузка…</div></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🎼</div>
    <div>Ничего не найдено</div>
  </div>
</main>

<footer>Родные напевы · репертуар ансамбля</footer>

<!-- Login modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>Вход для редактирования</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="почта@yandex.ru">
    <label>Пароль</label>
    <input type="password" id="loginPass" autocomplete="current-password">
    <div class="login-error" id="loginError">Неверный email или пароль</div>
    <div class="modal-actions">
      <button type="button" class="cancel" id="loginCancel">Отмена</button>
      <button type="button" class="save" id="loginSubmit">Войти</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 id="editTitle">Редактировать</h2>
    <input type="hidden" id="editId">
    <label>Название *</label>
    <input type="text" id="f_title">
    <div class="row2">
      <div>
        <label>Композитор</label>
        <input type="text" id="f_composer">
      </div>
      <div>
        <label>Автор слов</label>
        <input type="text" id="f_lyricist">
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Тональность</label>
        <input type="text" id="f_key" placeholder="Em, G, F#m…">
      </div>
      <div>
        <label>Страна</label>
        <select id="f_country">
          <option value="Русское">Русское</option>
          <option value="Зарубежное">Зарубежное</option>
          <option value="">—</option>
        </select>
      </div>
    </div>
    <label>Теги (через запятую)</label>
    <input type="text" id="f_tags" placeholder="ретро, военная, патриотика">
    <div class="row2">
      <div>
        <label>Исполнитель(и)</label>
        <input type="text" id="f_performers">
      </div>
      <div>
        <label>Тип исполнения</label>
        <select id="f_perfType">
          <option value="">—</option>
          <option>Соло</option>
          <option>Дуэт</option>
          <option>Трио</option>
          <option>Ансамбль</option>
          <option>Инструментал</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Длительность</label>
        <input type="text" id="f_duration" placeholder="3:10">
      </div>
      <div>
        <label>Частота</label>
        <select id="f_frequency">
          <option value="">—</option>
          <option>Часто</option>
          <option>Иногда</option>
          <option>Редко</option>
          <option>Архив</option>
        </select>
      </div>
    </div>
    <label>Концертные программы</label>
    <input type="text" id="f_programs" placeholder="День Победы; …">
    <div class="row2">
      <div>
        <label>Источник</label>
        <input type="text" id="f_source" placeholder="фильм, опера…">
      </div>
      <div>
        <label>Сложность (1–5)</label>
        <select id="f_difficulty">
          <option value="">—</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </div>
    </div>
    <label>Аккомпанемент</label>
    <input type="text" id="f_accompaniment">
    <label>Материалы</label>
    <div class="checks">
      <label><input type="checkbox" id="f_hasNotes"> Ноты</label>
      <label><input type="checkbox" id="f_hasScore"> Партитура</label>
      <label><input type="checkbox" id="f_hasMinus"> Минус</label>
      <label><input type="checkbox" id="f_hasVideo"> Видео</label>
      <label><input type="checkbox" id="f_hasAudio"> Аудио</label>
    </div>
    <label>Примечание</label>
    <textarea id="f_note"></textarea>
    <div class="modal-actions">
      <button type="button" class="cancel" id="editCancel">Отмена</button>
      <button type="button" class="save" id="editSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/** Фамилия для сортировки: "В. Соловьёв-Седой" → "Соловьёв-Седой", "РНП" → "РНП" */
function composerSurname(composer) {
  const s = (composer || '').trim();
  if (!s) return 'яяя';
  // убрать инициалы вида "В." "А.А." в начале
  const withoutInitials = s.replace(/^([А-ЯЁA-Z]\.\s*)+/u, '').trim();
  if (withoutInitials) {
    // если осталось несколько слов — берём последнее как фамилию
    // но "Соловьёв-Седой" уже одно "слово"; "фон Трамп" редко
    const parts = withoutInitials.split(/\s+/);
    return parts[parts.length - 1].toLowerCase().replace(/ё/g, 'е');
  }
  return s.toLowerCase().replace(/ё/g, 'е');
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s) {
  return (s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"'']/g, '');
}
function yn(v) {
  if (v === true || v === false) return v;
  if (!v) return null;
  const s = String(v).trim().toLowerCase();
  if (s === 'да' || s === 'yes' || s === 'true' || s === '1') return true;
  if (s === 'нет' || s === 'no' || s === 'false' || s === '0') return false;
  return null;
}
function isYes(v) { return yn(v) === true; }

function rebuildTagCounts() {

function loadSongs() {
  return db.collection('songs').get().then(snap => {
    if (snap.empty) {
      SONGS = SEED.map(s => ({ ...s }));
      rebuildTagCounts();
      $seedBtn.style.display = user ? 'inline-block' : 'none';
      return;
    }
    SONGS = [];
    snap.forEach(doc => {
      const d = doc.data();
      SONGS.push({
        docId: doc.id,
        id: d.id || 0,
        title: d.title || '',
        composer: d.composer || '',
        lyricist: d.lyricist || '',
        country: d.country || '',
        key: d.key || '',
        performers: d.performers || '',
        perfType: d.perfType || '',
        duration: d.duration || '',

        hasAudio: d.hasAudio || '',

  $seedBtn.textContent = 'Загрузка…';
  try {

    let batch = db.batch();
    let n = 0;
    for (const s of SEED) {
      const ref = db.collection('songs').doc();
      batch.set(ref, { ...s, tags: s.tags || [] });
      n++;
      if (n % batchSize === 0) {
        await batch.commit();
        batch = db.batch();
      }
    }
    if (n % batchSize !== 0) await batch.commit();
    toast('Песни загружены');

function renderChips() {
  const allTags = Object.keys(tagCounts).filter(t => t !== 'песня').sort((a, b) => (tagCounts[b] || 0) - (tagCounts[a] || 0));
  const primarySet = new Set(PRIMARY.filter(t => tagCounts[t]));
  const secondary = allTags.filter(t => !primarySet.has(t));
  const tags = showAllChips ? [...primarySet, ...secondary] : [...primarySet];
  let html = tags.map(t => {
    const active = activeTags.has(t) ? ' active' : '';
    return `<button type="button" class="chip${active}" data-tag="${t}">${t}<span class="n">${tagCounts[t] || 0}</span></button>`;
  }).join('');
  if (secondary.length) {
    html += `<button type="button" class="more-filters-btn" id="moreBtn">${showAllChips ? 'Свернуть' : 'Ещё теги…'}</button>`;
  }
  if (activeTags.size) {
    html += `<button type="button" class="chip" id="clearTags" style="border-color:#fca5a5;color:#b91c1c">✕ Сбросить теги</button>`;
  }
  $filters.innerHTML = html;
  $filters.querySelectorAll('.chip[data-tag]').forEach(btn => {
    btn.onclick = () => {
      const t = btn.dataset.tag;
      if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
      render();
    };
  });
  const more = document.getElementById('moreBtn');
  if (more) more.onclick = () => { showAllChips = !showAllChips; renderChips(); };
  const clear = document.getElementById('clearTags');
  if (clear) clear.onclick = () => { activeTags.clear(); render(); };
}

function filtered() {
  const q = norm($q.value.trim());
  const freq = $freqFilter.value;
  const perf = $perfFilter.value;
  let list = SONGS.filter(s => {
    if (activeTags.size) {
      for (const t of activeTags) if (!(s.tags || []).includes(t)) return false;
    }
    if (freq && s.frequency !== freq) return false;
    if (perf && s.perfType !== perf) return false;
    if (!q) return true;
    const hay = norm([s.title, s.composer, s.lyricist, s.key, s.performers, s.programs, s.source, s.note, ...(s.tags || [])].join(' '));
    return q.split(/\s+/).every(w => hay.includes(w));
  });
  const sort = $sort.value;
  list = [...list].sort((a, b) => {
    if (sort === 'composer') return composerSurname(a.composer).localeCompare(composerSurname(b.composer), 'ru') || a.title.localeCompare(b.title, 'ru');
    if (sort === 'key') return (a.key || 'яяя').localeCompare(b.key || 'яяя', 'ru') || a.title.localeCompare(b.title, 'ru');
    if (sort === 'frequency') return (FREQ_ORDER[a.frequency] || 9) - (FREQ_ORDER[b.frequency] || 9) || a.title.localeCompare(b.title, 'ru');
    return a.title.localeCompare(b.title, 'ru');
  });
  return list;
}

function row(label, value) {
  const v = value && String(value).trim() ? esc(value) : '—';
  const cls = (value && String(value).trim()) ? '' : ' class="dash"';
  return `<dt>${esc(label)}</dt><dd${cls}>${v}</dd>`;
}
function mat(label, val) {
  return isYes(val) ? `<span class="mat yes">✓ ${label}</span>` : `<span class="mat">${label}</span>`;
}
function freqClass(f) {
  if (f === 'Часто') return 'freq-often';
  if (f === 'Иногда') return 'freq-sometimes';
  if (f === 'Редко') return 'freq-rare';
  if (f === 'Архив') return 'freq-archive';
  return '';
}

  const list = filtered();
  $count.innerHTML = `Найдено: <strong>${list.length}</strong> из ${SONGS.length}`;

  $list.innerHTML = list.map(s => {
    const isOpen = openId != null && (String(openId) === String(s.docId || '') || String(openId) === String(s.id));
    const tagsHtml = (s.tags || []).filter(t => t !== 'песня').map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const tagsText = (s.tags || []).join(', ');
    const lyricist = s.lyricist ? `<span class="sep">·</span>${esc(s.lyricist)}` : '';
    let quick = '';
    if (s.perfType) quick += `<span class="pill">${esc(s.perfType)}</span>`;
    if (s.duration) quick += `<span class="pill">${esc(s.duration)}</span>`;
    if (s.frequency) quick += `<span class="pill ${freqClass(s.frequency)}">${esc(s.frequency)}</span>`;
    if (s.performers) quick += `<span class="pill">👤 ${esc(s.performers)}</span>`;

    const mats = [mat('Ноты', s.hasNotes), mat('Партитура', s.hasScore), mat('Минус', s.hasMinus), mat('Видео', s.hasVideo), mat('Аудио', s.hasAudio)].join('');

    let dl = '';
    dl += row('Композитор', s.composer);
    dl += row('Автор слов', s.lyricist);
    dl += row('Тональность', s.key);
    dl += row('Страна', s.country);
    dl += row('Теги', tagsText);
    dl += row('Исполнитель(и)', s.performers);
    dl += row('Тип исполнения', s.perfType);
    dl += row('Длительность', s.duration);
    dl += row('Частота', s.frequency);
    dl += row('Концертные программы', s.programs);
    dl += row('Источник', s.source);
    dl += row('Уровень сложности', s.difficulty ? s.difficulty + ' / 5' : '');
    dl += row('Аккомпанемент', s.accompaniment);
    dl += `<dt>Материалы</dt><dd><div class="materials">${mats}</div></dd>`;

    let actions = '';
    if (user) {
      actions = `<div class="edit-actions">
        <button type="button" data-edit="${esc(s.docId || '')}">Редактировать</button>
        <button type="button" class="danger" data-del="${esc(s.docId || '')}">Удалить</button>
      </div>`;
    }

    const oid = s.docId || s.id;
    return `<article class="card${isOpen ? ' open' : ''}" data-oid="${esc(String(oid))}">
      <div class="card-top">
        <div>
          <div class="title">${esc(s.title)}</div>
          <div class="meta">${esc(s.composer || '—')}${lyricist}${s.country === 'Зарубежное' ? '<span class="sep">·</span>зарубежное' : ''}</div>
        </div>
        ${s.key ? `<div class="key-badge">${esc(s.key)}</div>` : ''}
      </div>
      ${quick ? `<div class="quick-row">${quick}</div>` : ''}
      ${tagsHtml ? `<div class="tags-row">${tagsHtml}</div>` : ''}
      <div class="details">
        <dl>${dl}</dl>
        ${s.note ? `<div class="note-box">${esc(s.note)}</div>` : `<div class="note-box" style="opacity:.55">Примечание: —</div>`}
        ${actions}
      </div>
    </article>`;
  }).join('');

  $list.querySelectorAll('.card').forEach(card => {
    card.onclick = (e) => {
      if (e.target.closest('button')) return;
      const oid = card.dataset.oid;
      openId = String(openId) === String(oid) ? null : String(oid);
      render();
    };
  });
  $list.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const song = SONGS.find(s => s.docId === btn.dataset.edit);
      if (song) openEditor(song);
    };
  });
  $list.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const song = SONGS.find(s => s.docId === btn.dataset.del);
      if (song) deleteSong(song);
    };
  });
}

$q.addEventListener('input', render);
$sort.addEventListener('change', render);
$freqFilter.addEventListener('change', render);
$perfFilter.addEventListener('change', render);

// file:// often breaks Firebase — use GitHub Pages URL
if (location.protocol === 'file:') {
  console.warn('Откройте сайт через GitHub Pages, не как локальный файл');
}
loadSongs().then(render);
</script>
</body>
</html>
